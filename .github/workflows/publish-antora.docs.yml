name: Publish Antora Docs Preview

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv
      - name: Build antora documentation
        shell: devenv shell -- bash -e {0}
        run: |
          task docs:build-docs
      - name: Publish PR documentation preview
        if: github.event_name == 'pull_request'
        id: preview-publish
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: docs/build/site
          preview-branch: gh-pages
          comment: false
      - name: Create an artifact for the built documentation
        id: upload-docs
        uses: actions/upload-artifact@v4
        with:
          name: antora-docs
          path: docs/build/site
      - name: Create Single HTML preview for docs
        id: upload-single-doc
        uses: actions/upload-artifact@v4
        with:
          name: antora-single-page.html
          path: docs/build/site/cv-analyzer/_exports/index.html
      - name: Comment on PR with documentation preview
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = '${{ steps.upload-docs.outputs.artifact-url }}';
            const singlePageUrl = '${{ steps.upload-single-doc.outputs.artifact-url }}';
            const prNumber = '${{ github.event.number }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## 📚 Antora documentation preview for PR ${prNumber}',
                '',
                `**[Download the built documentation](${artifactUrl})**`,
                `**[See HTML preview on one page](${singlePageUrl})**`,
                ``,
                `**[Preview generated](${{ steps.preview-publish.outputs.preview-url }})**`,
                `**[Live GHPages snapshot for PR#${prNumber}](https://sebastianluczak.github.io/cv-platform/pr-preview/pr-${prNumber}/cv-analyzer/index.html)**`,
                '',
                'Download and extract the ZIP, then open `cv-analyzer/index.html` or see live preview.'
              ].join('\n')
            });