name: Publish Antora Docs Preview

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write 
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv
      - name: Build antora documentation
        shell: devenv shell -- bash -e {0}
        run: |
          task docs:build-docs
      - name: Publish PR documentation preview
        if: github.event_name == 'pull_request'
        id: preview-publish
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: docs/build/site
          preview-branch: gh-pages
          comment: false
      - name: Upload static files as artifact
        id: deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/site
      - name: Deploy artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deployment-pages
        env:
          name: github-pages
          url: ${{ steps.deployment.outputs.page_url }}
        uses: actions/deploy-pages@v4

      # - name: Create an artifact for the built documentation
      #   id: upload-docs
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: antora-docs
      #     path: docs/build/site
      # - name: Create Single HTML preview for docs
      #   id: upload-single-doc
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: antora-single-page.html
      #     path: docs/build/site/cv-analyzer/_exports/index.html
      - name: Comment on PR with documentation preview
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const prNumber = context.issue.number;
            const marker = '<!-- antora-docs-preview -->';

            const body = [
              marker,
              `📚 **[Antora documentation preview](https://sebastianluczak.github.io/cv-platform/pr-preview/pr-${prNumber}/cv-analyzer/index.html)**`
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }