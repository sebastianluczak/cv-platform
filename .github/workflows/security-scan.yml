name: Go security scan

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-scan.yml"
      - "services/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-gosec:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'test-ready')
    name: Prepare gosec
    runs-on: self-hosted
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/common/go.mod

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Stage gosec binary
        run: |
          mkdir -p "$RUNNER_TEMP/gosec"
          cp "$(go env GOPATH)/bin/gosec" "$RUNNER_TEMP/gosec/gosec"

      - name: Upload gosec binary
        uses: actions/upload-artifact@v4
        with:
          name: gosec-binary
          path: ${{ runner.temp }}/gosec/gosec
          retention-days: 1

  gosec:
    name: Scan ${{ matrix.service }}
    runs-on: self-hosted
    needs: prepare-gosec
    strategy:
      fail-fast: false
      matrix:
        service: [uploader, extractor, piistripper, skillmatcher, offermatcher, aiweighter, roleinsights, common]
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Download gosec binary
        uses: actions/download-artifact@v4
        with:
          name: gosec-binary
          path: ${{ runner.temp }}/gosec

      - name: Add gosec to PATH
        run: |
          chmod +x "$RUNNER_TEMP/gosec/gosec"
          echo "$RUNNER_TEMP/gosec" >> "$GITHUB_PATH"

      - name: Download module dependencies
        working-directory: services/${{ matrix.service }}
        run: go mod download

      - name: Scan module
        working-directory: services/${{ matrix.service }}
        run: gosec -fmt sarif -out gosec.sarif ./...

      - name: Upload SARIF results
        if: >-
          always() &&
          hashFiles(format('services/{0}/gosec.sarif', matrix.service)) != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: services/${{ matrix.service }}/gosec.sarif
          category: gosec/${{ matrix.service }}
