name: Build and test services

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'test.sh'
      - '.github/workflows/continuos-integration.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'test-ready')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv
      - name: Install PDF tool "pdftotext"
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Copy distribution environment file
        run: cp .env.dist .env
      - name: Build the devenv shell and run any git hooks
        run: devenv test
