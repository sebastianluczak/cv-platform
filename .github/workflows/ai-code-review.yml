name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install trusted reviewer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p /tmp/trusted-reviewer
          git show "${BASE_SHA}:reviewer/reviewer.py" > /tmp/trusted-reviewer/reviewer.py
          git show "${BASE_SHA}:reviewer/requirements.txt" > /tmp/trusted-reviewer/requirements.txt
          python -m pip install -r /tmp/trusted-reviewer/requirements.txt

      - name: Review pull request
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'nvidia/nemotron-3-super-120b-a12b:free' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p reviewer
          python /tmp/trusted-reviewer/reviewer.py \
            --base "${BASE_SHA}" \
            --model "${REVIEW_MODEL}" \
            --output reviewer/reviewer.json
          test -s reviewer/reviewer.json

      - name: Comment with review
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('reviewer/reviewer.json', 'utf8'));
            const marker = '<!-- ai-code-review -->';
            const findings = report.findings || [];
            const findingSections = findings.map((finding, index) => [
              `### ${index + 1}. ${finding.severity.toUpperCase()}: ${finding.title}`,
              `\`${finding.file}:${finding.line}\` · Confidence: ${Math.round(finding.confidence * 100)}%`,
              finding.explanation,
              `**Suggested fix:** ${finding.suggested_fix}`
            ].join('\n\n'));
            const body = [
              marker,
              '## AI code review',
              report.summary,
              findings.length
                ? `### Findings (${findings.length})\n\n${findingSections.join('\n\n')}`
                : 'No actionable findings.',
              report.metadata?.diff_truncated
                ? '> The diff was truncated; this review may be incomplete.'
                : ''
            ].filter(Boolean).join('\n\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }
