version: 3

tasks:
  prep:file:
    desc: Prepares some test data for app in /tmp
    cmds:
      - cp product.png /tmp/image.png
      - cp sample_resume.pdf /tmp/resume.pdf
  prep:lint:
    desc: Lints all projects
    cmds:
      - cd services/aiweighter && gofmt -l -e -w .
      - cd services/extractor && gofmt -l -e -w .
      - cd services/piistripper && gofmt -l -e -w .
      - cd services/skillmatcher && gofmt -l -e -w .
      - cd services/uploader && gofmt -l -e -w .
  security:scan:
    dir: services
    desc: Perform gosec scan on all projects
    cmds:
      - go install github.com/securego/gosec/v2/cmd/gosec@latest
      - cd aiweigher && gosec ./... || true
      - cd extractor && gosec ./... || true
      - cd piistripper && gosec ./... || true
      - cd skillmatcher && gosec ./... || true
      - cd uploader && gosec ./... || true
  ui:install:
    dir: ui
    desc: Install the UI application dependencies
    cmds:
      - npm ci
  ui:start:
    deps: [ui:install]
    dir: ui
    desc: Start the UI application
    cmds:
      - npm run dev
  ui:build:
    deps: [ui:install]
    dir: ui
    desc: Build the UI application
    cmds:
      - npm run build
  services:uploader:start:
    desc: Start the uploader service
    cmds:
      - go -C services/uploader run .
  services:extractor:start:
    desc: Start the extractor service
    cmds:
      - go -C services/extractor run .
  services:piistripper:start:
    desc: Start the PII stripping service
    cmds:
      - go -C services/piistripper run .
  services:skillmatcher:start:
    desc: Start the skill matcher service
    cmds:
      - go -C services/skillmatcher run .
  services:aiweighter:start:
    desc: Start the AI weighter service
    cmds:
      - go -C services/aiweighter run .
  docs:build-docs:
    dir: docs
    desc: Build the documentation
    cmds:
      - npm ci
      - antora --fetch antora-playbook.yml
      - echo '<meta http-equiv="refresh" content="0;url=cv-analyzer/index.html">' > build/site/index.html
  
  # BUILD SECTION #
  services:uploader:build:
    dir: services/uploader
    desc: Build production docker image
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o uploader .
      - docker build -t uploader .
  services:extractor:build:
    dir: services/extractor
    desc: Build production docker image
    cmds:
      - CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o extractor .
      - docker build -t extractor .
  services:piistripper:build:
    dir: services/piistripper
    desc: Build production docker image
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o piistripper .
      - docker build -t piistripper .
  services:skillmatcher:build:
    dir: services/skillmatcher
    desc: Build production docker image
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o skillmatcher .
      - docker build -t skillmatcher .

  
  # AI CODE REVIEW #
  review:install:
    dir: reviewer
    desc: Set up the Python AI reviewer
    cmds:
      - python3 -m venv .venv
      - .venv/bin/python -m pip install -r reviewer/requirements.txt
    status:
      - test -x .venv/bin/python
      - .venv/bin/python -c "import requests"

  review:
    dir: reviewer
    desc: Review current branch with OpenRouter AI
    deps: [review:install]
    cmds:
      - .venv/bin/python reviewer.py --base "{{.BASE | default "origin/main"}}" --model "{{.MODEL | default "nvidia/nemotron-3-super-120b-a12b:free"}}"
